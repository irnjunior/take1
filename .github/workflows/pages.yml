name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Separar só os arquivos públicos do site
        run: |
          mkdir _site
          cp -r index.html robots.txt sitemap.xml assets _site/
          for pasta in quem-somos publicidade comunicacao-empresarial marketing-digital design-grafico \
                       videos-de-treinamento regulamentacao-de-rifas clientes fale-conosco; do
            cp -r "$pasta" _site/
          done
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
